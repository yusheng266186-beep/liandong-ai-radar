name: Refresh merchant catalog

on:
  push:
    branches: [main]
    paths:
      - scripts/crawl-catalog.mjs
      - .github/workflows/crawl.yml
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: merchant-catalog-refresh
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Discover offers and verify original pages
        run: npm run crawl
        env:
          CATALOG_MAX_LOAD_CLICKS: 60
          CATALOG_MAX_VERIFY: 260
          CATALOG_VERIFY_CONCURRENCY: 6
      - name: Validate generated data
        run: npm test
      - name: Commit changed snapshot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- public/data/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "liandong-radar[bot]"
          git config user.email "liandong-radar[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          git commit -m "data: refresh merchant catalog"
          # Pages or documentation commits may land while a long crawl is
          # running. Rebase the generated snapshot before publishing it so a
          # harmless concurrent commit cannot discard an otherwise valid run.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed snapshot
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
