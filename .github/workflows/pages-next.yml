name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog-pages-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Restore rolling catalog history
        id: catalog-cache
        uses: actions/cache/restore@v4
        with:
          path: .catalog-cache/catalog.json
          key: catalog-v4-${{ github.run_id }}
          restore-keys: |
            catalog-v4-

      - name: Seed crawler from previous deployment
        if: steps.catalog-cache.outputs.cache-matched-key != ''
        run: cp .catalog-cache/catalog.json public/data/catalog.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover, verify, and compare offers
        run: npm run crawl
        env:
          CATALOG_MAX_LOAD_CLICKS: 60
          CATALOG_MAX_VERIFY: 320
          CATALOG_VERIFY_CONCURRENCY: 8
          CATALOG_DISCOVERY_CONCURRENCY: 2
          CATALOG_FEED_FRESH_HOURS: 6
          CATALOG_PAGE_TIMEOUT_MS: 11000

      - name: Validate data and source
        run: |
          npm test
          npm run lint

      - name: Save rolling catalog history
        run: |
          mkdir -p .catalog-cache
          cp public/data/catalog.json .catalog-cache/catalog.json

      - name: Persist rolling catalog cache
        uses: actions/cache/save@v4
        with:
          path: .catalog-cache/catalog.json
          key: catalog-v4-${{ github.run_id }}

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
